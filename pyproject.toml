[project]
name = "hacs-pydantic-ai-agent"
version = "0.2.0"
description = "Home Assistant custom integration for Pydantic AI Agent"
readme = "README.md"
requires-python = ">=3.14.2"
license = "Apache-2.0"
dependencies = [
  "logfire==4.33.0",
  "pydantic-ai-slim==1.97.0",
  "fastmcp-slim[client,server]>=3.3.0",
  "anthropic>=0.97.0",
  "google-genai>=1.70.0",
  "tiktoken>=0.12.0",
  "bashkit==0.7.2",
  "markdownify>=1.2",
  "names-generator==0.2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "PyTurboJPEG>=1.8.3",
  "basedpyright>=1.34.0",
  "hassil>=3.5.0",
  "home-assistant-intents>=2026.5.5",
  "homeassistant>=2026.5.1",
  "pre-commit>=4.5.0",
  "pytest-aiohttp>=1.1.0",
  "pytest-asyncio>=1.2.0",
  "pytest-homeassistant-custom-component>=0.13.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "pytest>=8.4.2",
  "ruff>=0.15.12",
  "yamllint>=1.37.1",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["custom_components", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
  "provider_integration: calls a live OpenAI-compatible provider",
]

[tool.pyright]
include = ["custom_components/pydantic_ai_agent", "tests/components/pydantic_ai_agent"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportMissingTypeStubs = "none"
reportAny = "none"
reportExplicitAny = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeArgument = "none"
reportUnannotatedClassAttribute = "none"
reportUnusedCallResult = "none"
reportUnusedParameter = "none"
reportImplicitOverride = "none"
reportIncompatibleVariableOverride = "warning"
reportIncompatibleMethodOverride = "warning"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D104"]
"tests/**/*.py" = ["D", "ANN"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D", "ANN", "C90"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pydoclint]
style = "google"
check-return-types = true
skip-checking-short-docstrings = false
skip-checking-private-functions = true
skip-checking-raises = true
arg-type-hints-in-docstring = false
arg-type-hints-in-signature = true
allow-init-docstring = true
check-class-attributes = false
require-return-section-when-returning-nothing = false
should-document-star-arguments = false
