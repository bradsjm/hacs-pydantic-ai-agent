[project]
name = "hacs-pydantic-agent"
version = "0.1.0"
description = "Home Assistant custom integration for Pydantic AI Agent"
readme = "README.md"
requires-python = ">=3.14.2"
license = "Apache-2.0"
dependencies = [
  "logfire==4.33.0",
  "pydantic-ai-skills==0.10.0",
  "pydantic-ai-slim[openai,mcp]==1.97.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "homeassistant==2026.5.1",
  "hassil>=3.5.0",
  "home-assistant-intents>=2026.5.5",
  "pytest>=8.4.2",
  "pytest-aiohttp>=1.1.0",
  "pytest-asyncio>=1.2.0",
  "pytest-homeassistant-custom-component>=0.13.0",
  "pytest-timeout>=2.4.0",
  "PyTurboJPEG>=1.8.3",
  "ruff>=0.15.12",
  "yamllint>=1.37.1",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["custom_components", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
  "real_server: calls a real OpenAI-compatible provider",
]

[tool.pyright]
include = ["custom_components/pydantic_ai_agent", "tests/components/pydantic_ai_agent"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportPrivateImportUsage = false
reportTypedDictNotRequiredAccess = false
