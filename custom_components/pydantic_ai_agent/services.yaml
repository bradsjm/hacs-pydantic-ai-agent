list_mcp_tools:
  name: List MCP tools
  description: List cached MCP tools for one workspace, discovering them if no cache exists.
  fields:
    config_entry_id:
      name: Config entry
      description: Pydantic AI Agent workspace config entry.
      required: true
      selector:
        config_entry:
          integration: pydantic_ai_agent
    mcp_server_id:
      name: MCP server ID
      description: Optional MCP server subentry ID. If omitted, all configured MCP servers are listed.
      required: false
      example: mcp-server-1
      selector:
        text:
refresh_mcp_tools:
  name: Refresh MCP tools
  description: Reconnect to configured MCP servers and refresh their tool catalogs.
  fields:
    config_entry_id:
      name: Config entry
      description: Pydantic AI Agent workspace config entry.
      required: true
      selector:
        config_entry:
          integration: pydantic_ai_agent
    mcp_server_id:
      name: MCP server ID
      description: Optional MCP server subentry ID. If omitted, all configured MCP servers are refreshed.
      required: false
      example: mcp-server-1
      selector:
        text:
get_agent_run_diagnostics:
  name: Get agent run diagnostics
  description: Return a compact slice of the latest run diagnostics for one conversation or AI task subentry.
  fields:
    config_entry_id:
      name: Config entry
      description: Pydantic AI Agent workspace config entry.
      required: true
      selector:
        config_entry:
          integration: pydantic_ai_agent
    subentry_id:
      name: Subentry ID
      description: Conversation or AI task subentry ID whose latest run diagnostics should be returned.
      required: true
      example: conversation-1
      selector:
        text:
    section:
      name: Section
      description: Optional diagnostic section. Omit for a compact summary.
      required: false
      selector:
        select:
          options:
            - summary
            - usage
            - tool_definitions
            - tool_calls
            - model_profile
            - output
            - errors
            - timeline
    offset:
      name: Offset
      description: Number of timeline or tool-call events to skip.
      required: false
      default: 0
      selector:
        number:
          min: 0
          mode: box
    limit:
      name: Limit
      description: Maximum number of timeline or tool-call events to return.
      required: false
      default: 25
      selector:
        number:
          min: 1
          max: 100
          mode: box
get_workspace_status:
  name: Get workspace status
  description: Return compact config-entry, subentry, and runtime status for Pydantic AI Agent workspaces.
  fields:
    config_entry_id:
      name: Config entry
      description: Optional Pydantic AI Agent workspace config entry. If omitted, all workspaces are returned.
      required: false
      selector:
        config_entry:
          integration: pydantic_ai_agent
    include_subentries:
      name: Include subentries
      description: Include provider, conversation, AI task, MCP server, and Skill subentry summaries.
      required: false
      default: true
      selector:
        boolean:
    include_runtime:
      name: Include runtime
      description: Include loaded runtime counts and Home Semantic Index status.
      required: false
      default: true
      selector:
        boolean:
list_model_profiles:
  name: List model profiles
  description: List configured provider-owned model profiles without probing providers.
  fields:
    config_entry_id:
      name: Config entry
      description: Optional Pydantic AI Agent workspace config entry. If omitted, all workspaces are returned.
      required: false
      selector:
        config_entry:
          integration: pydantic_ai_agent
    provider_subentry_id:
      name: Provider subentry ID
      description: Optional provider subentry ID to filter the returned profiles.
      required: false
      selector:
        text:
    enabled_only:
      name: Enabled only
      description: Return only enabled model profiles.
      required: false
      default: false
      selector:
        boolean:
get_agent_metrics:
  name: Get agent metrics
  description: Return the current in-memory metrics snapshot for conversation and AI task subentries.
  fields:
    config_entry_id:
      name: Config entry
      description: Optional Pydantic AI Agent workspace config entry. If omitted, all workspaces are returned.
      required: false
      selector:
        config_entry:
          integration: pydantic_ai_agent
    subentry_id:
      name: Subentry ID
      description: Optional conversation or AI task subentry ID to filter metrics.
      required: false
      selector:
        text:
get_tool_source_status:
  name: Get tool source status
  description: Return cached MCP tool and native Skill status without refreshing or executing tools.
  fields:
    config_entry_id:
      name: Config entry
      description: Optional Pydantic AI Agent workspace config entry. If omitted, all workspaces are returned.
      required: false
      selector:
        config_entry:
          integration: pydantic_ai_agent
    subentry_id:
      name: Subentry ID
      description: Optional MCP server or Skill subentry ID to filter tool sources.
      required: false
      selector:
        text:
    include_tool_names:
      name: Include tool names
      description: Include cached MCP tool names when available.
      required: false
      default: true
      selector:
        boolean:
    limit:
      name: Limit
      description: Maximum number of cached tool names to return for each MCP server.
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 200
          mode: box
refresh_home_semantic_index:
  name: Refresh home semantic index
  description: Refresh the Home Semantic Index for one workspace and return compact readiness diagnostics.
  fields:
    config_entry_id:
      name: Config entry
      description: Pydantic AI Agent workspace config entry.
      required: true
      selector:
        config_entry:
          integration: pydantic_ai_agent
    reason:
      name: Reason
      description: Optional diagnostic reason stored as the refresh reason.
      required: false
      default: service_request
      selector:
        text:
    wait:
      name: Wait
      description: Wait for the refresh to complete before returning.
      required: false
      default: true
      selector:
        boolean:
trace_home_semantic_resolution:
  name: Trace home semantic resolution
  description: Trace how a phrase ranks and filters Home Semantic Index candidates.
  fields:
    config_entry_id:
      name: Config entry
      description: Pydantic AI Agent workspace config entry.
      required: true
      selector:
        config_entry:
          integration: pydantic_ai_agent
    assistant_id:
      name: Assistant ID
      description: Optional assistant ID used for Home Assistant exposed-entity filtering. Defaults to the conversation assistant.
      required: false
      selector:
        text:
    phrase:
      name: Phrase
      description: Natural-language phrase to trace, such as kitchen lights.
      required: true
      example: kitchen lights
      selector:
        text:
    action:
      name: Action
      description: Optional intended control action used to filter compatible targets.
      required: false
      selector:
        select:
          options:
            - turn_on
            - turn_off
            - toggle
            - activate
    area_id:
      name: Area ID
      description: Optional area ID expected for candidates.
      required: false
      selector:
        area:
    domain:
      name: Domain
      description: Optional entity domain expected for candidates.
      required: false
      example: light
      selector:
        text:
    limit:
      name: Limit
      description: Maximum number of ranked candidates to return.
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box
plan_home_semantic_control:
  name: Plan home semantic control
  description: Dry-run the same safety checks used by the LLM-only control_home tool without executing service calls.
  fields:
    config_entry_id:
      name: Config entry
      description: Pydantic AI Agent workspace config entry.
      required: true
      selector:
        config_entry:
          integration: pydantic_ai_agent
    assistant_id:
      name: Assistant ID
      description: Optional assistant ID used for Home Assistant exposed-entity filtering. Defaults to the conversation assistant.
      required: false
      selector:
        text:
    action:
      name: Action
      description: Control action to plan.
      required: true
      selector:
        select:
          options:
            - turn_on
            - turn_off
            - toggle
            - activate
    phrase:
      name: Phrase
      description: Natural-language target phrase. Provide phrase or entity_id.
      required: false
      example: living room lights
      selector:
        text:
    entity_id:
      name: Entity ID
      description: Explicit target entity. Provide phrase or entity_id.
      required: false
      selector:
        entity:
get_home_semantic_document:
  name: Get home semantic document
  description: Return compact document data for one indexed entity or document ID.
  fields:
    config_entry_id:
      name: Config entry
      description: Pydantic AI Agent workspace config entry.
      required: true
      selector:
        config_entry:
          integration: pydantic_ai_agent
    assistant_id:
      name: Assistant ID
      description: Optional assistant ID used for exposure flags. Defaults to the conversation assistant.
      required: false
      selector:
        text:
    entity_id:
      name: Entity ID
      description: Entity ID whose semantic document should be returned.
      required: false
      selector:
        entity:
    document_id:
      name: Document ID
      description: Semantic document ID to fetch.
      required: false
      example: entity:light.kitchen
      selector:
        text:
benchmark_home_semantic_resolution:
  name: Benchmark home semantic resolution
  description: Resolve a small batch of phrases and compare selected targets with expected entity IDs.
  fields:
    config_entry_id:
      name: Config entry
      description: Pydantic AI Agent workspace config entry.
      required: true
      selector:
        config_entry:
          integration: pydantic_ai_agent
    assistant_id:
      name: Assistant ID
      description: Optional assistant ID used for Home Assistant exposed-entity filtering. Defaults to the conversation assistant.
      required: false
      selector:
        text:
    cases:
      name: Cases
      description: List of phrase/action/expected target cases to resolve.
      required: true
      example:
        - phrase: kitchen lights
          action: turn_off
          expected_entity_id: light.kitchen
      selector:
        object:
    limit:
      name: Limit
      description: Maximum number of cases to run.
      required: false
      default: 20
      selector:
        number:
          min: 1
          max: 100
          mode: box
get_home_semantic_summary:
  name: Get home semantic summary
  description: Return exposed areas, capabilities, and control counts from the Home Semantic Index.
  fields:
    config_entry_id:
      name: Config entry
      description: Pydantic AI Agent workspace config entry.
      required: true
      selector:
        config_entry:
          integration: pydantic_ai_agent
    assistant_id:
      name: Assistant ID
      description: Optional assistant ID used for Home Assistant exposed-entity filtering. Defaults to the conversation assistant.
      required: false
      selector:
        text:
resolve_home_semantic_target:
  name: Resolve home semantic target
  description: Resolve a natural-language phrase to one exposed semantic home target.
  fields:
    config_entry_id:
      name: Config entry
      description: Pydantic AI Agent workspace config entry.
      required: true
      selector:
        config_entry:
          integration: pydantic_ai_agent
    assistant_id:
      name: Assistant ID
      description: Optional assistant ID used for Home Assistant exposed-entity filtering. Defaults to the conversation assistant.
      required: false
      selector:
        text:
    phrase:
      name: Phrase
      description: Natural-language phrase to resolve, such as kitchen lights.
      required: true
      example: kitchen lights
      selector:
        text:
    action:
      name: Action
      description: Optional intended action used to filter compatible targets.
      required: false
      selector:
        select:
          options:
            - turn_on
            - turn_off
            - toggle
            - activate
get_home_semantic_context:
  name: Get home semantic context
  description: Return compact exposed live state from the Home Semantic Index for an explicit entity or query scope.
  fields:
    config_entry_id:
      name: Config entry
      description: Pydantic AI Agent workspace config entry.
      required: true
      selector:
        config_entry:
          integration: pydantic_ai_agent
    assistant_id:
      name: Assistant ID
      description: Optional assistant ID used for Home Assistant exposed-entity filtering. Defaults to the conversation assistant.
      required: false
      selector:
        text:
    entity_ids:
      name: Entity IDs
      description: Optional explicit entity IDs to include if exposed to the assistant.
      required: false
      selector:
        entity:
          multiple: true
    phrase:
      name: Phrase
      description: Optional natural-language phrase to search in the semantic index.
      required: false
      example: kitchen lights
      selector:
        text:
    domain:
      name: Domain
      description: Optional entity domain to include, such as light or sensor.
      required: false
      example: light
      selector:
        text:
    area_id:
      name: Area ID
      description: Optional area ID to include exposed entities from.
      required: false
      selector:
        area:
    limit:
      name: Limit
      description: Maximum number of entities to return.
      required: false
      default: 20
      selector:
        number:
          min: 1
          max: 100
          mode: box
