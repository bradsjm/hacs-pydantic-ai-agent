repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: scripts/yaml-check
        language: system
        files: \.(ya?ml|yamllint)$
      - id: markdownlint
        name: markdownlint
        entry: scripts/markdown-check
        language: system
        files: \.md$
